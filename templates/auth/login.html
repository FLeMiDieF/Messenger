{% extends "base.html" %}
{% block title %}Вход — Messenger{% endblock %}

{% block body %}
<div class="auth-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-chat-dots-fill text-accent" style="font-size:2.8rem;"></i>
      <h2 class="fw-bold mt-2">Messenger</h2>
      <p class="text-muted small">Войдите в аккаунт</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'danger' if cat == 'danger' else 'warning' }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <input type="text" name="username" class="form-control form-control-lg"
               placeholder="Имя пользователя" required autofocus>
      </div>
      <div class="mb-4">
        <input type="password" name="password" class="form-control form-control-lg"
               placeholder="Пароль" required>
      </div>
      <button class="btn btn-accent w-100 py-2 fw-semibold">Войти</button>
    </form>
    <p class="text-center mt-3 text-muted small">
      Нет аккаунта?
      <a href="{{ url_for('auth.register') }}" class="text-accent fw-medium text-decoration-none">Создать</a>
    </p>
  </div>
</div>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}
